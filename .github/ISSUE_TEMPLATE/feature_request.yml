name: Feature request
description: Suggest a change or an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you add or change? Check ROADMAP.md first.
    validations:
      required: true
