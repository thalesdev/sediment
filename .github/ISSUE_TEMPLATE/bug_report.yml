name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A test or a short program is best.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Go version, OS, architecture, commit.
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data loss
      options:
        - label: A write that had returned was lost, or the database became unreadable. If so, use a private security report instead.
