# Settings of the container image. The data is in /data, a volume.
#
# The server listens on all the addresses of the container, and the container
# network is what keeps it private. Publish the port on the loopback address of the
# host, as in
#
#   docker run -p 127.0.0.1:6379:6379 -v sediment-data:/data sediment
#
# and set up users and TLS before you publish it to a network. See SECURITY.md.
bind 0.0.0.0
port 6379
dir /data
insecure-bind yes
